# Cargo workspace: several Rust crates built together into one target/ folder.
[workspace]
resolver = "3"
members = ["game", "verify"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
ron = "0.12.3"

# Terrain building is heavy maths; unoptimised debug builds made big planets
# take many seconds to load in tests. Optimise the game crate even in debug.
[profile.dev.package.orbital_ante]
opt-level = 2
